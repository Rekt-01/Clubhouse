<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Rugged Bar — Speakeasy Entrance</title>
  <style>
    :root {
      --bg-night: #08090f;
      --brick: #7a3426;
      --brick-dark: #4a1c14;
      --mortar: #1a0e0b;
      --door-base: #2a303c;
      --door-mid: #3b4454;
      --door-light: #4f5a6e;
      --metal: #1e232c;
      --neon-gold: #ffb703;
      --neon-cyan: #00f5d4;
      --neon-pink: #ff006e;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body, html {
      width: 100%; height: 100%;
      background: var(--bg-night);
      overflow: hidden;
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========== BRICK WALL ========== */
    .brick-wall {
      position: fixed;
      inset: 0;
      background-color: var(--brick-dark);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 20%, rgba(255,183,3,0.09) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 80%, rgba(0,0,0,0.5) 0%, transparent 70%),
        repeating-linear-gradient(
          0deg,
          var(--mortar) 0px,
          var(--mortar) 5px,
          var(--brick) 5px,
          var(--brick) 38px
        ),
        repeating-linear-gradient(
          90deg,
          var(--mortar) 0px,
          var(--mortar) 5px,
          transparent 5px,
          transparent 76px
        );
      background-size: 100% 100%, 100% 100%, 76px 43px, 76px 43px;
      background-position: 0 0, 0 0, 0 0, 38px 21.5px;
      z-index: 1;
    }

    /* subtle vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* ========== SCENE ========== */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 420px;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      padding: 12px;
    }

    /* Neon sign */
    .neon-sign {
      position: relative;
      margin-bottom: 18px;
      text-align: center;
      z-index: 5;
    }
    .neon-sign h1 {
      font-size: clamp(1.1rem, 4.5vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--neon-gold);
      text-shadow:
        0 0 6px var(--neon-gold),
        0 0 18px var(--neon-gold),
        0 0 36px rgba(255,183,3,0.4);
      animation: neonFlicker 4.5s infinite alternate;
    }
    .neon-sign span {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--neon-cyan);
      margin-top: 4px;
      text-shadow: 0 0 8px var(--neon-cyan);
      opacity: 0.85;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
        text-shadow: 0 0 6px var(--neon-gold), 0 0 18px var(--neon-gold), 0 0 36px rgba(255,183,3,0.4);
      }
      20%, 24%, 55% {
        opacity: 0.75;
        text-shadow: 0 0 3px var(--neon-gold), 0 0 8px var(--neon-gold);
      }
    }

    /* Doorway frame */
    .doorway {
      position: relative;
      width: 92%;
      height: 78%;
      background: #140c0a;
      border-radius: 18px 18px 10px 10px;
      padding: 14px;
      box-shadow:
        0 25px 50px rgba(0,0,0,0.85),
        inset 0 0 40px rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* arched top */
    .doorway::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 8%;
      right: 8%;
      height: 22px;
      background: #1f120f;
      border-radius: 50% 50% 0 0;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.5);
    }

    /* Heavy door */
    .door {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        145deg,
        var(--door-light) 0%,
        var(--door-mid) 35%,
        var(--door-base) 70%,
        #1c2028 100%
      );
      border: 5px solid #15191f;
      border-radius: 12px;
      box-shadow:
        inset 0 12px 28px rgba(255,255,255,0.07),
        inset 0 -18px 35px rgba(0,0,0,0.75),
        0 0 0 1px rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px;
      transition: transform 0.12s ease;
    }
    .door.knock {
      transform: translateY(3px) scale(0.992);
    }

    /* Rivets */
    .rivet {
      position: absolute;
      width: 11px;
      height: 11px;
      background: radial-gradient(circle at 32% 32%, #e5e9f0, #3b4252 60%, #1e222b);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.3);
    }
    .r-tl { top: 12px; left: 12px; }
    .r-tr { top: 12px; right: 12px; }
    .r-bl { bottom: 12px; left: 12px; }
    .r-br { bottom: 12px; right: 12px; }
    .r-ml { top: 48%; left: 12px; }
    .r-mr { top: 48%; right: 12px; }

    /* Top metal plate */
    .plate-top {
      position: absolute;
      top: 11%;
      width: 48%;
      height: 48px;
      background: linear-gradient(160deg, #2e3440, #1a1e26);
      border: 2px solid #0f1216;
      border-radius: 5px;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.06),
        0 4px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plate-top span {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: #8b9bb4;
      text-transform: uppercase;
    }

    /* ========== HATCH ========== */
    .hatch {
      position: relative;
      width: 148px;
      height: 86px;
      margin-top: 28px;
      background: #07090d;
      border: 5px solid #14181f;
      border-radius: 7px;
      box-shadow:
        inset 0 12px 24px rgba(0,0,0,0.95),
        0 0 0 1px rgba(255,255,255,0.03);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.12s ease;
    }
    .hatch:active { transform: scale(0.96); }

    /* Sliding shutter */
    .shutter {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, #5a6578 0%, #3d4658 45%, #2a303c 100%);
      border: 2px solid #12151b;
      border-radius: 4px;
      z-index: 6;
      transition: transform 0.5s var(--bounce);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 14px rgba(0,0,0,0.6);
    }
    .shutter::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 8px,
        rgba(0,0,0,0.12) 8px,
        rgba(0,0,0,0.12) 9px
      );
      border-radius: 3px;
      pointer-events: none;
    }
    .shutter-bar {
      width: 42px;
      height: 5px;
      background: #0f1218;
      border-radius: 3px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }
    .hatch.open .shutter {
      transform: translateX(112%);
    }

    /* Eyes */
    .eyes {
      position: absolute;
      inset: 0;
      background: #030407;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .hatch.open .eyes { opacity: 1; }

    .eye {
      width: 30px;
      height: 30px;
      background: #f0f4f8;
      border-radius: 50%;
      position: relative;
      box-shadow:
        0 0 14px rgba(0,245,212,0.55),
        inset 0 3px 6px rgba(0,0,0,0.35);
      border: 2px solid #0a0c10;
      overflow: hidden;
    }

    .pupil {
      position: absolute;
      width: 13px;
      height: 13px;
      background: #0a0c10;
      border-radius: 50%;
      top: 8px;
      left: 8px;
      animation: lookAround 3.2s infinite ease-in-out;
    }
    .pupil::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2.5px;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
    }

    /* eyelid for blink */
    .eyelid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: #0a0c10;
      border-radius: 50% 50% 0 0;
      animation: blink 4.8s infinite;
      z-index: 2;
    }

    @keyframes lookAround {
      0%, 100% { transform: translate(-4px, -2px); }
      20%      { transform: translate(5px, 2px); }
      45%      { transform: translate(-3px, 4px); }
      70%      { transform: translate(4px, -1px); }
    }
    @keyframes blink {
      0%, 92%, 100% { height: 0; }
      94%, 96% { height: 100%; }
    }

    /* Light spill when open */
    .hatch.open::after {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(0,245,212,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      animation: glowPulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes glowPulse {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    /* Mail slot */
    .mail-slot {
      position: absolute;
      bottom: 16%;
      width: 52px;
      height: 28px;
      background: #15191f;
      border: 3px solid #0c0e12;
      border-radius: 5px;
      box-shadow:
        inset 0 5px 8px rgba(0,0,0,0.85),
        0 2px 4px rgba(0,0,0,0.4);
    }
    .mail-slot::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      height: 4px;
      background: #0a0c10;
      border-radius: 2px;
    }

    /* Door handle */
    .handle {
      position: absolute;
      right: 22px;
      top: 52%;
      width: 14px;
      height: 42px;
      background: linear-gradient(90deg, #5a6578, #3b4454);
      border-radius: 4px;
      box-shadow:
        2px 3px 6px rgba(0,0,0,0.5),
        inset 1px 0 2px rgba(255,255,255,0.15);
    }
    .handle::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -3px;
      width: 20px;
      height: 10px;
      background: linear-gradient(180deg, #6b7689, #3b4454);
      border-radius: 3px;
    }

    /* Instruction text */
    .instruction {
      position: absolute;
      bottom: 4.5%;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--neon-gold);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255,183,3,0.45);
      animation: pulse 2.2s ease-in-out infinite;
      transition: opacity 0.3s;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50%     { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="brick-wall"></div>
  <div class="vignette"></div>

  <div class="scene">
    <div class="neon-sign">
      <h1>THE RUGGED BAR</h1>
      <span>SPEAKEASY · EST. 1923</span>
    </div>

    <div class="doorway">
      <div class="door" id="door">
        <div class="rivet r-tl"></div>
        <div class="rivet r-tr"></div>
        <div class="rivet r-bl"></div>
        <div class="rivet r-br"></div>
        <div class="rivet r-ml"></div>
        <div class="rivet r-mr"></div>

        <div class="plate-top"><span>Members Only</span></div>

        <div class="hatch" id="hatch" onclick="knock()" title="Knock">
          <div class="eyes">
            <div class="eye">
              <div class="eyelid"></div>
              <div class="pupil"></div>
            </div>
            <div class="eye">
              <div class="eyelid"></div>
              <div class="pupil"></div>
            </div>
          </div>
          <div class="shutter">
            <div class="shutter-bar"></div>
          </div>
        </div>

        <div class="mail-slot"></div>
        <div class="handle"></div>

        <div class="instruction" id="text">⚡ Tap hatch to knock ⚡</div>
      </div>
    </div>
  </div>

  <script>
    let isOpen = false;
    let knockCount = 0;

    function knock() {
      if (isOpen) return;

      const hatch = document.getElementById('hatch');
      const door  = document.getElementById('door');
      const text  = document.getElementById('text');

      // visual knock feedback
      door.classList.add('knock');
      setTimeout(() => door.classList.remove('knock'), 130);

      knockCount++;
      isOpen = true;
      hatch.classList.add('open');

      const lines = [
        "👀 Who goes there…?",
        "👀 Checking your vibe…",
        "👀 Password?",
        "👀 You look familiar…",
        "👀 Come back at midnight."
      ];
      text.textContent = lines[Math.min(knockCount - 1, lines.length - 1)];

      setTimeout(() => {
        hatch.classList.remove('open');
        isOpen = false;
        text.textContent = "⚡ Tap hatch to knock ⚡";
      }, 3800);
    }
  </script>
</body>
</html>
