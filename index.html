<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Rugged Bar — Stylized Speakeasy Entrance</title>
  <style>
    :root {
      --bg-night: #0b0c16;
      --brick-red: #8b3a2b;
      --brick-shadow: #4a1d15;
      --mortar: #1f110e;
      --door-metal: #3b4252;
      --door-highlight: #4c566a;
      --door-dark: #2e3440;
      --hatch-metal: #434c5e;
      --neon-gold: #ffb703;
      --neon-cyan: #00f5d4;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body, html {
      width: 100%; height: 100%;
      background: var(--bg-night);
      overflow: hidden;
      font-family: "SF Mono", "Fira Code", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cartoon Brick Wall Background with Arched Header Vibe */
    .brick-wall {
      position: fixed;
      inset: 0;
      background-color: var(--brick-shadow);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(255,183,3,0.12) 0%, transparent 70%),
        repeating-linear-gradient(0deg, var(--mortar), var(--mortar) 6px, var(--brick-red) 6px, var(--brick-red) 42px),
        repeating-linear-gradient(90deg, var(--mortar), var(--mortar) 6px, transparent 6px, transparent 84px);
      background-size: 100% 100%, 84px 48px, 84px 48px;
      background-position: 0 0, 0 0, 42px 24px;
      z-index: 1;
    }

    .scene-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 850px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* Deep Recessed Doorway Frame */
    .doorway-frame {
      position: relative;
      width: 86%;
      height: 88%;
      background: #1a0f0d;
      border-radius: 20px 20px 8px 8px;
      padding: 16px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Arched Header Shadow Effect */
    .doorway-frame::before {
      content: '';
      position: absolute;
      top: -16px; left: 10%; right: 10%;
      height: 25px;
      background: #2b1814;
      border-radius: 50% 50% 0 0;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }

    /* Heavy Steel Door */
    .heavy-door {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--door-highlight), var(--door-metal) 40%, var(--door-dark));
      border: 6px solid #1e222b;
      border-radius: 14px;
      box-shadow: inset 0 10px 25px rgba(255,255,255,0.08), inset 0 -15px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Industrial Rivets matching photo layout */
    .rivet {
      position: absolute;
      width: 12px; height: 12px;
      background: radial-gradient(circle at 35% 35%, #d8dee9, #2e3440);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.7);
    }
    .r-tl { top: 14px; left: 14px; }
    .r-tr { top: 14px; right: 14px; }
    .r-bl { bottom: 14px; left: 14px; }
    .r-br { bottom: 14px; right: 14px; }

    /* Upper Patched Metal Plate (from photo reference) */
    .metal-patch-top {
      position: absolute;
      top: 15%;
      width: 45%;
      height: 55px;
      background: linear-gradient(145deg, #2e3440, #1e222b);
      border: 2px solid #111418;
      border-radius: 6px;
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 4px 8px rgba(0,0,0,0.5);
    }

    /* Middle Sliding Hatch (Interactive) */
    .hatch-box {
      position: relative;
      width: 150px;
      height: 90px;
      background: #0d1017;
      border: 5px solid #181d26;
      border-radius: 8px;
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.15s ease;
      margin-top: 20px;
    }
    .hatch-box:active { transform: scale(0.97); }

    /* Sliding Metal Shutter */
    .shutter {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #4c566a, var(--hatch-metal) 50%, #2e3440);
      border: 2px solid #181d26;
      border-radius: 4px;
      z-index: 5;
      transition: transform 0.45s var(--bounce);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .shutter-bar {
      width: 45px; height: 6px;
      background: #181d26;
      border-radius: 3px;
    }
    .hatch-box.open .shutter {
      transform: translateX(110%);
    }

    /* Expressive Cartoon Eyes inside the Hatch */
    .eyes-container {
      position: absolute;
      inset: 0;
      background: #05070a;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .hatch-box.open .eyes-container {
      opacity: 1;
    }

    .eye {
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 12px rgba(0,245,212,0.7), inset 0 2px 4px rgba(0,0,0,0.4);
      border: 2px solid #111;
      overflow: hidden;
    }

    /* Dynamic sweeping pupils */
    .pupil {
      position: absolute;
      width: 12px; height: 12px;
      background: #111;
      border-radius: 50%;
      top: 8px; left: 8px;
      animation: sweepEyes 2.6s infinite ease-in-out;
    }
    .pupil::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 3px; height: 3px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes sweepEyes {
      0%   { transform: translate(-5px, -2px); }
      30%  { transform: translate(5px, 3px); }
      60%  { transform: translate(-4px, 4px); }
      100% { transform: translate(-5px, -2px); }
    }

    /* Lower Mail / Small Drop Slot (from reference photo) */
    .mail-slot {
      position: absolute;
      bottom: 18%;
      width: 50px; height: 32px;
      background: #1e222b;
      border: 3px solid #111418;
      border-radius: 6px;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.8);
    }

    /* Knock Prompt */
    .knock-instruction {
      position: absolute;
      bottom: 5%;
      font-size: 0.75rem;
      color: var(--neon-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255,183,3,0.5);
      animation: pulseText 2s infinite ease-in-out;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="brick-wall"></div>

  <div class="scene-container">
    <div class="doorway-frame">
      <div class="heavy-door">
        <div class="rivet r-tl"></div>
        <div class="rivet r-tr"></div>
        <div class="rivet r-bl"></div>
        <div class="rivet r-br"></div>

        <div class="metal-patch-top"></div>

        <!-- Sliding Hatch with Eyes -->
        <div class="hatch-box" id="hatchBox" onclick="knockHatch()" title="Tap hatch to knock">
          <div class="eyes-container">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
          </div>
          <div class="shutter" id="shutter">
            <div class="shutter-bar"></div>
          </div>
        </div>

        <div class="mail-slot"></div>

        <div class="knock-instruction" id="instructionText">⚡ Tap hatch to knock ⚡</div>
      </div>
    </div>
  </div>

  <script>
    let isOpen = false;

    function knockHatch() {
      const box = document.getElementById('hatchBox');
      const text = document.getElementById('instructionText');

      if (!isOpen) {
        box.classList.add('open');
        isOpen = true;
        text.textContent = "👀 Someone's checking your vibe...";

        setTimeout(() => {
          box.classList.remove('open');
          isOpen = false;
          text.textContent = "⚡ Tap hatch to knock ⚡";
        }, 4200);
      }
    }
  </script>
</body>
</html>
